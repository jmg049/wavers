[package]
name = "wavers"
version = "0.1.0"
edition = "2024"

[lib]
name = "wavers"
doctest = false
crate-type = ["cdylib", "rlib"]

[dependencies]
memmap2 = "0.9.5"
thiserror = "2.0.12"
i24 = { version = "2.1.0", features = ["alloc"] }
audio_samples = { path = "../audio_samples" }
nom = "8.0.0"
colored = { version = "3.0.0", optional = true }
term_size = "0.3.2"
num-traits = "0.2.19"
num-complex = "0.4"
ndarray = "0.16.1"
log = { version = "0.4.22", optional = true }

[dev-dependencies]
hound = "3.5.1"
rand = "0.9.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[features]
default = ["colored_output"]
colored_output = ["dep:colored"]
log = ["dep:log"]
resample = []

