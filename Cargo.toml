[package]
name = "wavers"
version = "0.1.0"
edition = "2024"

[dependencies]
memmap2 = "0.9.5"
thiserror = "2.0.12"
i24 = { git="https://www.github.com/jmg049/i24.git" }
audio_sample = { path = "../audio_sample", features = ["visualization"] }
nom = "8.0.0"
colored = { version = "3.0.0", optional = true }
term_size = "0.3.2"
num-traits = "0.2.19"

[features]
default = ["colored_output"]  # Default features - colored output not included by default
colored_output = ["dep:colored"]  # Feature that enables colored output

[dev-dependencies]
hound = "3.5.1"
rand = "0.9.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
